  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration & Early PWA Capture -->
    <script>
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent default mini-infobar and stash event for in-app install button
        e.preventDefault();
        window.deferredPrompt = e;
        // Dispatch custom event to notify React
        window.dispatchEvent(new CustomEvent('pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('App was successfully installed!');
      });

      // تسجيل وتحديث الـ Service Worker بشكل مستقر واحترافي
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('Service Worker Registered!', reg.scope);
              // فحص أي تحديثات جديدة في الخلفية دون تعطيل عمل الطالب أوفلاين
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('🔄 تم تحميل تحديث جديد لمنصة الكنز بنجاح.');
                    }
                  };
                }
              };
            })
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
